<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />

  <meta name="robots" content="index, follow" />
  <link rel="canonical" href="https://akwamaryn-pl.com/miot.html" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <style>
    :root{
      --bg-1:#fffafc;
      --bg-2:#f8eef3;
      --panel:#fff8fb;
      --panel-2:rgba(255,255,255,0.88);
      --line:#f0dfe6;
      --line-strong:#e4c8d2;
      --line-dark:#b78898;
      --text:#654f58;
      --text-strong:#7a5665;
      --text-soft:#866873;
      --badge:#f1e5ea;
      --shadow:0 14px 34px rgba(0,0,0,0.05);
      --shadow-hover:0 16px 30px rgba(171,135,149,0.14);
      --max:1320px;
    }

    *{
      box-sizing:border-box;
      margin:0;
      padding:0;
    }

    html{
      scroll-behavior:smooth;
    }

    body{
      font-family:"Inter",sans-serif;
      color:var(--text);
      background:linear-gradient(180deg,var(--bg-1) 0%, var(--bg-2) 100%);
      overflow-x:hidden;
    }

    a{
      color:inherit;
      text-decoration:none;
    }

    img{
      display:block;
      max-width:100%;
    }

    button{
      font:inherit;
      border:none;
      background:none;
      cursor:pointer;
    }

    .page-wrap{
      position:relative;
      overflow:hidden;
    }

    .topbar{
      position:sticky;
      top:0;
      z-index:5000;
      background:rgba(255,248,251,0.95);
      backdrop-filter:blur(10px);
      -webkit-backdrop-filter:blur(10px);
      border-bottom:1px solid rgba(218,189,200,0.2);
    }

    .topbar-inner{
      width:min(var(--max), calc(100% - 36px));
      margin:auto;
      min-height:88px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:18px;
      flex-wrap:wrap;
    }

    .brand{
      font-family:"Cormorant Garamond",serif;
      color:var(--text-strong);
      white-space:nowrap;
      font-size:58px;
      line-height:0.95;
      font-weight:600;
      letter-spacing:0.2px;
    }

    .nav{
      display:flex;
      align-items:center;
      flex-wrap:wrap;
      gap:18px;
      color:var(--text);
    }

    .nav a{
      font-family:"Cormorant Garamond",serif;
      font-size:21px;
      color:var(--text);
      transition:0.25s ease;
    }

    .nav a:hover{
      color:var(--text-strong);
    }

    .nav-cta{
      min-width:152px;
      min-height:42px;
      padding:0 18px;
      border:2px solid #d6b0be;
      color:var(--text-strong);
      display:inline-flex;
      align-items:center;
      justify-content:center;
      font-size:16px;
      font-weight:600;
      letter-spacing:0.5px;
      position:relative;
      margin-left:14px;
      transition:0.25s ease;
      overflow:hidden;
      background:#fff8fb;
      border-radius:16px;
      box-shadow:0 8px 18px rgba(171,135,149,0.08);
    }

    .nav-cta:hover{
      box-shadow:0 12px 22px rgba(171,135,149,0.14);
      transform:translateY(-2px);
    }

    .nav-cta::before,
    .nav-cta::after{
      content:"";
      position:absolute;
      width:14px;
      height:14px;
      border-color:#b78898;
      z-index:2;
    }

    .nav-cta::before{
      top:-2px;
      left:-2px;
      border-top:3px solid #b78898;
      border-left:3px solid #b78898;
      border-radius:10px 0 0 0;
    }

    .nav-cta::after{
      right:-2px;
      bottom:-2px;
      border-right:3px solid #b78898;
      border-bottom:3px solid #b78898;
      border-radius:0 0 10px 0;
    }

    .container{
      width:min(var(--max), calc(100% - 36px));
      margin:auto;
      padding:34px 0 80px;
      position:relative;
      z-index:1;
    }

    .fade-in{
      opacity:0;
      transform:translateY(42px);
      transition:opacity 0.85s ease, transform 0.85s ease;
    }

    .fade-in.show{
      opacity:1;
      transform:translateY(0);
    }

    @keyframes softSweep{
      0%{
        transform:translateX(-180%) rotate(16deg);
        opacity:0;
      }

      18%{
        opacity:1;
      }

      100%{
        transform:translateX(260%) rotate(16deg);
        opacity:0;
      }
    }

    @keyframes frameGlow{
      0%,100%{
        box-shadow:
          0 0 0 rgba(183,136,152,0),
          0 12px 30px rgba(171,135,149,0.10);
      }

      50%{
        box-shadow:
          0 0 18px rgba(183,136,152,0.10),
          0 16px 34px rgba(171,135,149,0.16);
      }
    }

    .animated-frame{
      position:relative;
      overflow:hidden;
      animation:frameGlow 3.2s ease-in-out infinite;
    }

    .animated-frame::before{
      content:"";
      position:absolute;
      top:-130%;
      left:-45%;
      width:34%;
      height:380%;
      background:linear-gradient(
        90deg,
        rgba(183,136,152,0) 0%,
        rgba(183,136,152,0.10) 40%,
        rgba(255,255,255,0.55) 50%,
        rgba(183,136,152,0.10) 60%,
        rgba(183,136,152,0) 100%
      );
      transform:translateX(-180%) rotate(16deg);
      opacity:0;
      pointer-events:none;
      z-index:3;
    }

    .animated-frame:hover::before{
      opacity:1;
      animation:softSweep 1.35s ease;
    }

    .hero{
      display:grid;
      grid-template-columns:1.02fr 0.98fr;
      gap:34px;
      align-items:center;
      min-height:680px;
      margin-bottom:54px;
    }

    .hero-copy{
      padding:18px 0;
    }

    .hero-line{
      display:flex;
      align-items:center;
      gap:12px;
      margin-bottom:24px;
    }

    .hero-line::before{
      content:"";
      width:150px;
      height:3px;
      background:linear-gradient(90deg,#e4c8d2 0%, #b78898 50%, #e4c8d2 100%);
      border-radius:999px;
      flex-shrink:0;
    }

    .hero-line::after{
      content:"";
      width:26px;
      height:2px;
      background:#b78898;
      border-radius:999px;
      flex-shrink:0;
    }

    .hero-line span{
      display:block;
      width:150px;
      height:3px;
      background:linear-gradient(90deg,#e4c8d2 0%, #b78898 50%, #e4c8d2 100%);
      border-radius:999px;
      flex-shrink:0;
    }

    .hero-copy h1{
      font-family:"Cormorant Garamond",serif;
      font-size:82px;
      line-height:0.94;
      font-weight:600;
      color:var(--text-strong);
      margin-bottom:18px;
    }

    .hero-accent{
      font-family:"Cormorant Garamond",serif;
      font-size:28px;
      line-height:1.2;
      color:var(--text-soft);
      font-style:italic;
      margin-bottom:26px;
    }

    .hero-copy p{
      max-width:670px;
      font-size:17px;
      line-height:2;
      color:var(--text);
      margin-bottom:26px;
    }

    .hero-mini{
      color:var(--text-soft);
      font-family:"Cormorant Garamond",serif;
      font-size:28px;
      line-height:1.2;
      font-style:italic;
      margin-bottom:28px;
    }

    .hero-btn{
      min-width:150px;
      min-height:42px;
      padding:0 18px;
      border:2px solid #d6b0be;
      color:var(--text-strong);
      display:inline-flex;
      align-items:center;
      justify-content:center;
      font-size:16px;
      font-weight:600;
      position:relative;
      letter-spacing:0.3px;
      transition:0.25s ease;
      overflow:hidden;
      border-radius:16px;
      background:#fff8fb;
      box-shadow:0 8px 18px rgba(171,135,149,0.08);
    }

    .hero-btn:hover{
      transform:translateY(-2px);
      box-shadow:0 12px 22px rgba(171,135,149,0.14);
    }

    .hero-btn::before,
    .hero-btn::after{
      content:"";
      position:absolute;
      width:14px;
      height:14px;
      border-color:#b78898;
      z-index:2;
    }

    .hero-btn::before{
      top:-2px;
      left:-2px;
      border-top:3px solid #b78898;
      border-left:3px solid #b78898;
      border-radius:10px 0 0 0;
    }

    .hero-btn::after{
      right:-2px;
      bottom:-2px;
      border-right:3px solid #b78898;
      border-bottom:3px solid #b78898;
      border-radius:0 0 10px 0;
    }

    .hero-image-wrap{
      display:flex;
      align-items:center;
      justify-content:center;
      width:100%;
    }

    .hero-image{
      width:100%;
      max-width:100%;
      display:block;
      border:1px solid var(--line-strong);
      padding:10px;
      background:#fff8fb;
      box-shadow:var(--shadow);
      transition:0.4s ease;
      border-radius:30px;
    }

    .hero-image:hover{
      transform:translateY(-6px);
      box-shadow:var(--shadow-hover);
      border-color:#d6b0be;
    }

    .hero-image img{
      display:block;
      width:100%;
      height:auto;
      max-height:none;
      object-fit:contain;
      object-position:center;
      border-radius:22px;
      background:#fff8fb;
    }

    .section{
      margin-bottom:54px;
    }

    .section-wrap{
      background:var(--panel-2);
      padding:40px;
      border-radius:30px;
      box-shadow:var(--shadow);
    }

    .section-header{
      text-align:center;
      margin-bottom:34px;
      position:relative;
    }

    .frame-title{
      display:inline-block;
      position:relative;
      padding:34px 46px;
    }

    .frame-title::before,
    .frame-title::after,
    .frame-title .corner-in::before,
    .frame-title .corner-in::after{
      content:"";
      position:absolute;
      pointer-events:none;
    }

    .frame-title::before{
      top:0;
      left:0;
      width:120px;
      height:78px;
      border-top:2px solid var(--line-dark);
      border-left:2px solid var(--line-dark);
    }

    .frame-title::after{
      right:0;
      bottom:0;
      width:120px;
      height:78px;
      border-right:2px solid var(--line-dark);
      border-bottom:2px solid var(--line-dark);
    }

    .frame-title .corner-in::before{
      top:10px;
      left:10px;
      width:76px;
      height:48px;
      border-top:2px solid rgba(183,136,152,0.55);
      border-left:2px solid rgba(183,136,152,0.55);
    }

    .frame-title .corner-in::after{
      right:10px;
      bottom:10px;
      width:76px;
      height:48px;
      border-right:2px solid rgba(183,136,152,0.55);
      border-bottom:2px solid rgba(183,136,152,0.55);
    }

    .section-header h2{
      font-family:"Cormorant Garamond",serif;
      font-size:64px;
      font-weight:600;
      line-height:1;
      color:var(--text-strong);
      margin-bottom:10px;
      position:relative;
      z-index:2;
    }

    .section-header p{
      color:var(--text-soft);
      font-family:"Cormorant Garamond",serif;
      font-size:24px;
      font-style:italic;
      line-height:1.3;
      position:relative;
      z-index:2;
    }
    .intro-layout{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:34px;
      align-items:start;
    }

    .text-block{
      color:var(--text);
      font-size:17px;
      line-height:2;
    }

    .text-block p{
      margin-bottom:18px;
    }

    .info-cards{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:16px;
    }

    .info-card{
      background:var(--panel);
      border:1px solid var(--line);
      border-radius:22px;
      padding:22px 20px;
      min-height:132px;
      box-shadow:0 10px 26px rgba(171,135,149,0.08);
      transition:0.35s ease;
    }

    .info-card:hover{
      transform:translateY(-4px);
      border-color:#d6b0be;
      box-shadow:var(--shadow-hover);
    }

    .info-card strong{
      display:block;
      font-family:"Cormorant Garamond",serif;
      font-size:34px;
      line-height:1;
      color:var(--text-strong);
      margin-bottom:10px;
      font-weight:600;
    }

    .info-card span{
      display:block;
      color:var(--text);
      font-size:15px;
      line-height:1.7;
    }

    .parents-grid{
      display:grid;
      gap:32px;
    }

    .parent-card{
      display:grid;
      grid-template-columns:0.95fr 1.05fr;
      gap:30px;
      align-items:center;
      background:rgba(255,248,251,0.7);
      border:1px solid var(--line);
      border-radius:28px;
      padding:22px;
      box-shadow:0 10px 24px rgba(171,135,149,0.08);
    }

    .parent-card.reverse{
      grid-template-columns:1.05fr 0.95fr;
    }

    .parent-card.reverse .parent-copy{
      order:1;
    }

    .parent-card.reverse .parent-photo-wrap{
      order:2;
    }

    .parent-photo{
      border:1px solid var(--line-strong);
      padding:10px;
      background:#fff8fb;
      border-radius:28px;
      box-shadow:0 10px 28px rgba(171,135,149,0.10);
    }

    .parent-photo img{
      width:100%;
      border-radius:20px;
      cursor:pointer;
    }

    .parent-copy h3{
      font-family:"Cormorant Garamond",serif;
      font-size:42px;
      color:var(--text-strong);
      margin-bottom:14px;
    }

    .badge{
      display:inline-block;
      padding:8px 14px;
      border-radius:999px;
      background:#f4e8ed;
      font-size:13px;
      margin:4px;
    }

    /* GALERIA */

    .folders{
      display:grid;
      gap:24px;
    }

    .folder{
      background:#fff8fb;
      border-radius:30px;
      overflow:hidden;
      box-shadow:var(--shadow);
    }

    .folder-header{
      padding:24px;
      display:flex;
      justify-content:space-between;
      cursor:pointer;
    }

    .folder.open .folder-arrow{
      transform:rotate(180deg);
    }

    .folder-content{
      max-height:0;
      overflow:hidden;
      transition:max-height .5s ease;
    }

    .folder-inner{
      padding:24px;
    }

    .gallery-grid{
      display:grid;
      grid-template-columns:repeat(3,1fr);
      gap:20px;
    }

    .gallery-item{
      background:white;
      border-radius:20px;
      padding:10px;
      cursor:pointer;
    }

    .gallery-item img{
      width:100%;
      border-radius:15px;
    }

    @media (max-width:900px){
      .gallery-grid{
        grid-template-columns:repeat(2,1fr);
      }
    }

    @media (max-width:600px){
      .gallery-grid{
        grid-template-columns:1fr;
      }
    }

    /* LIGHTBOX */

    .lightbox{
      position:fixed;
      inset:0;
      background:rgba(0,0,0,.9);
      display:none;
      align-items:center;
      justify-content:center;
      z-index:9999;
    }

    .lightbox.show{
      display:flex;
    }

    .lightbox img{
      max-width:90vw;
      max-height:90vh;
      border-radius:20px;
    }

  </style>
</head>

<script>
function toggleFolder(id){
  const folder = document.getElementById(id);
  const content = folder.querySelector(".folder-content");

  folder.classList.toggle("open");

  if(folder.classList.contains("open")){
    content.style.maxHeight = content.scrollHeight + "px";
  }else{
    content.style.maxHeight = "0px";
  }
}

window.addEventListener("load", ()=>{
  document.querySelectorAll(".folder").forEach(f=>{
    if(f.classList.contains("open")){
      f.querySelector(".folder-content").style.maxHeight =
        f.querySelector(".folder-content").scrollHeight + "px";
    }
  });
});

const lightbox = document.getElementById("lightbox");
const lightboxImg = document.getElementById("lightboxImg");

function openImage(img){
  lightbox.classList.add("show");
  lightboxImg.src = img.src;
}

function closeImage(){
  lightbox.classList.remove("show");
}
</script>
